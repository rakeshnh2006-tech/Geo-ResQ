name: Deploy to IBM Cloud Code Engine

# Trigger: push to main branch OR manual workflow_dispatch
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_push:
        description: 'Skip Docker build/push (use existing image)'
        required: false
        default: 'false'

env:
  REGION: us-south
  APP_NAME: georesq

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Run the test suite
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          FLASK_ENV: testing
        run: python -m pytest backend/tests/ -v --tb=short

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Build, push, and deploy (only if tests pass)
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    # Only deploy on pushes to main (not PRs)
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag to short commit SHA
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Install IBM Cloud CLI
        run: |
          curl -fsSL https://clis.cloud.ibm.com/install/linux | sh
          ibmcloud plugin install container-registry --quiet
          ibmcloud plugin install code-engine       --quiet

      - name: Run deploy script
        env:
          IBM_CLOUD_API_KEY:     ${{ secrets.IBM_CLOUD_API_KEY }}
          ICR_NAMESPACE:         ${{ secrets.ICR_NAMESPACE }}
          CE_PROJECT:            ${{ secrets.CE_PROJECT }}
          DATABASE_URL:          ${{ secrets.DATABASE_URL }}
          SECRET_KEY:            ${{ secrets.SECRET_KEY }}
          WATSONX_API_KEY:       ${{ secrets.WATSONX_API_KEY }}
          WATSONX_URL:           ${{ secrets.WATSONX_URL }}
          WATSONX_PROJECT_ID:    ${{ secrets.WATSONX_PROJECT_ID }}
          GOOGLE_MAPS_API_KEY:   ${{ secrets.GOOGLE_MAPS_API_KEY }}
          REGION:                ${{ env.REGION }}
          APP_NAME:              ${{ env.APP_NAME }}
          IMAGE_TAG:             ${{ env.IMAGE_TAG }}
          SKIP_PUSH:             ${{ github.event.inputs.skip_push || 'false' }}
        run: bash scripts/deploy.sh
