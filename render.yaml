services:
  - type: web
    name: georesq
    runtime: python
    plan: free
    # System libraries needed by WeasyPrint (PDF export)
    packages:
      - libpango-1.0-0
      - libpangoft2-1.0-0
      - libcairo2
      - libgdk-pixbuf2.0-0
      - libffi-dev
    buildCommand: |
      pip install -r requirements.txt &&
      mkdir -p instance/briefings &&
      python scripts/init_db.py
    startCommand: gunicorn "backend.app:create_app('production')" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: georesq-db
          property: connectionString
      - key: WATSONX_API_KEY
        sync: false
      - key: WATSONX_URL
        value: https://us-south.ml.cloud.ibm.com
      - key: WATSONX_PROJECT_ID
        sync: false
      - key: WATSONX_MODEL_ID
        value: ibm/granite-13b-instruct-v2
      - key: GOOGLE_MAPS_API_KEY
        value: AIzaSyA78ELcIe9VmvvkaBtm7fHj6B8lvfKyH6I
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      - key: PDF_DIR
        value: /opt/render/project/src/instance/briefings
      - key: UPLOAD_FOLDER
        value: /opt/render/project/src/frontend/static/uploads

databases:
  - name: georesq-db
    plan: free
    databaseName: georesq
    user: georesq
